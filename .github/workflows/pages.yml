name: Publish Dalalnama
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/**'
      - 'assets/**'
      - 'admin/**'
      - 'scripts/**'
      - 'MLVMData/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: dalalnama-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build mobile news portal
        run: node scripts/build.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and Marathi font support
        run: |
          python -m pip install --disable-pip-version-check pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
      - name: Generate individual news thumbnails (1200 x 630)
        run: python scripts/generate_images.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
