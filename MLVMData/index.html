<style>*{box-sizing:border-box}html,body{padding:0;margin:0}body{background:#f6f7f1;font:16px system-ui,sans-serif}.preview{max-width:940px;margin:14px auto;padding:12px 17px;border:1px solid #dfc78d;background:#fff7de;border-radius:9px;color:#705129;font:600 15px system-ui,sans-serif}.frame{width:100%;border:0;display:block;min-height:1200px}</style></head><body>
<div id="preview" class="preview">नोंदणी सेवा लवकरच सुरू होईल. सध्या फॉर्मचे पूर्वदृश्य उपलब्ध आहे.</div>
<iframe class="frame" id="app" title="महाराष्ट्र लोक विकास मंच – संस्था नोंदणी" loading="eager" scrolling="no" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script src="./config.js"></script><script>
const app=document.getElementById('app'), note=document.getElementById('preview');
const u=String(window.MLVM_WEBAPP_URL||'').trim();
if(/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(\?|$)/.test(u)){
  app.src=u; note.style.display='none';
}else{app.src='./Index.html';}
window.addEventListener('message',e=>{
  if(e.source!==app.contentWindow || !e.data || e.data.mlvm!==true)return;
  const h=Number(e.data.height);if(Number.isFinite(h)&&h>300&&h<10000)app.style.height=Math.ceil(h+18)+'px';
});
</script></body></html>
